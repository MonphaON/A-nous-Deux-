<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body{
    height:100%;
    background:black;
    font-family:'Poppins', sans-serif;
    overflow:hidden;
}

/* FEED */
#feed{
    height:100vh;
    overflow-y:auto;
    scroll-snap-type:y mandatory;
}

.video-container{
    position:relative;
    height:100vh;
    width:100%;
    scroll-snap-align:start;
}

video{
    width:100%;
    height:100%;
    object-fit:contain;
}

/* overlay */
.overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
        to top,
        rgba(0,0,0,0.75),
        rgba(0,0,0,0.1),
        rgba(0,0,0,0.3)
    );
}

/* LEFT */
.left-info{
    position:absolute;
    bottom:120px;
    left:15px;
    color:white;
}

.username{
    font-weight:600;
    font-size:17px;
    margin-bottom:6px;
}

.description{
    font-size:14px;
    opacity:0.9;
}

/* RIGHT */
.right-icons{
    position:absolute;
    right:12px;
    bottom:120px;
    display:flex;
    flex-direction:column;
    gap:18px;
}

.icon-box{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
}

.icon{
    width:58px;
    height:58px;
    border-radius:50%;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(10px);

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:24px;
    cursor:pointer;

    transition:0.25s ease;

    color:white;

    border:1px solid rgba(255,255,255,0.08);

    box-shadow:
    0 4px 18px rgba(0,0,0,0.35),
    inset 0 1px 0 rgba(255,255,255,0.05);
}

.icon:hover{
    transform:scale(1.08);
    background:rgba(255,255,255,0.18);
}

.icon-text{
    font-size:13px;
    color:white;
}

/* ❤️ LIKE */
.like-active{
    background:rgba(255,0,90,0.65);
    animation:likePop 0.35s ease;
    transform:scale(1.2);
    box-shadow:0 0 18px rgba(255,0,90,0.7);
}

@keyframes likePop{
    0%{transform:scale(1);}
    40%{transform:scale(1.45);}
    70%{transform:scale(1.1);}
    100%{transform:scale(1.2);}
}

/* ⭐ FAVORIS */
.favorite-active{
    background:rgba(255,215,0,0.65);
    animation:favSpin 0.5s ease;
    transform:scale(1.15);
    box-shadow:0 0 20px rgba(255,215,0,0.9);
}

@keyframes favSpin{
    0%{transform:scale(1) rotate(0deg);}
    40%{transform:scale(1.35) rotate(12deg);}
    70%{transform:scale(1.1) rotate(-8deg);}
    100%{transform:scale(1.15) rotate(0deg);}
}

/* SOUND */
.sound-btn{
    position:absolute;
    top:20px;
    right:20px;

    background:rgba(0,0,0,0.5);
    backdrop-filter:blur(10px);

    padding:10px 14px;

    border-radius:25px;

    font-size:14px;
    cursor:pointer;
    color:white;

    z-index:10;

    transition:0.25s ease;
}

.sound-btn:hover{
    transform:scale(1.05);
    background:rgba(255,255,255,0.12);
}

/* ❤️ DOUBLE TAP */
.heart-pop{
    position:absolute;
    font-size:85px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%) scale(0);

    animation:popHeart 0.6s ease;

    pointer-events:none;
    z-index:9999;

    color:white;

    text-shadow:0 0 20px rgba(255,0,90,0.8);
}

@keyframes popHeart{
    0%{
        transform:translate(-50%,-50%) scale(0);
        opacity:0;
    }

    30%{
        transform:translate(-50%,-50%) scale(1.4);
        opacity:1;
    }

    60%{
        transform:translate(-50%,-50%) scale(1);
    }

    100%{
        transform:translate(-50%,-50%) scale(0);
        opacity:0;
    }
}

/* 💬 PANEL COMMENTAIRES */
#commentPanel{
    position:fixed;
    top:0;
    right:-100%;

    width:100%;
    max-width:380px;
    height:100%;

    background:white;
    color:black;

    display:flex;
    flex-direction:column;

    transition:0.35s ease;

    z-index:9999;

    border-top-left-radius:22px;
    border-bottom-left-radius:22px;

    overflow:hidden;
}

#commentPanel.active{
    right:0;
}

.comment-header{
    padding:16px;
    text-align:center;
    font-weight:600;
    border-bottom:1px solid #eee;
    position:relative;
    font-size:17px;
}

.close-btn{
    position:absolute;
    right:12px;
    top:10px;

    width:34px;
    height:34px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
    font-size:18px;

    background:#f2f2f2;

    transition:0.2s;
}

.close-btn:hover{
    background:#e4e4e4;
}

.comment-list{
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.comment{
    background:#f4f4f4;
    padding:12px 14px;
    border-radius:16px;
    margin-bottom:10px;
    font-size:14px;
    animation:pop 0.2s ease;
}

@keyframes pop{
    from{
        transform:scale(0.95);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }
}

.comment-input{
    display:flex;
    padding:10px;
    border-top:1px solid #eee;
    background:white;
}

.comment-input input{
    flex:1;

    padding:12px 14px;

    border:none;

    background:#f2f2f2;

    border-radius:25px;

    outline:none;

    font-size:14px;
}

.comment-input button{
    margin-left:8px;

    width:44px;
    height:44px;

    border:none;
    border-radius:50%;

    background:#ff2d55;
    color:white;

    font-size:18px;
    cursor:pointer;

    transition:0.2s;
}

.comment-input button:hover{
    transform:scale(1.08);
}

/* 🔥 NAVIGATION MODERNE */
.bottom-nav{
    position:fixed;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);

    width:92%;
    max-width:500px;
    height:72px;

    background:rgba(20,20,20,0.75);
    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.08);

    border-radius:28px;

    display:flex;
    justify-content:space-around;
    align-items:center;

    z-index:9999;

    box-shadow:
    0 8px 30px rgba(0,0,0,0.45),
    inset 0 1px 0 rgba(255,255,255,0.06);
}

.nav-item{
    width:30%;
    height:56px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-decoration:none;
    color:rgba(255,255,255,0.7);

    border-radius:18px;

    transition:0.25s ease;

    position:relative;
    overflow:hidden;
}

.nav-item:hover{
    background:rgba(255,255,255,0.08);
    transform:translateY(-2px);
}

.nav-item.active{
    background:linear-gradient(
        135deg,
        rgba(255,0,90,0.22),
        rgba(255,70,120,0.1)
    );

    color:white;

    box-shadow:
    0 0 18px rgba(255,0,90,0.25);
}

.nav-icon{
    font-size:22px;
    margin-bottom:2px;
}

.nav-text{
    font-size:12px;
    font-weight:500;
    letter-spacing:0.3px;
}

.nav-item:active{
    transform:scale(0.95);
}

.nav-item::before{
    content:"";
    position:absolute;

    width:120px;
    height:120px;

    background:radial-gradient(
        circle,
        rgba(255,255,255,0.18),
        transparent 70%
    );

    top:-70px;
    left:-60px;

    opacity:0;
    transition:0.4s;
}

.nav-item:hover::before{
    opacity:1;
}

</style>
</head>

<body>

<div id="feed"></div>

<!-- COMMENT PANEL -->
<div id="commentPanel">

    <div class="comment-header">
        Commentaires 💬

        <div class="close-btn" onclick="closeComments()">✕</div>
    </div>

    <div class="comment-list" id="commentList"></div>

    <div class="comment-input">
        <input id="commentInput" placeholder="Ajouter un commentaire...">
        <button onclick="sendComment()">➤</button>
    </div>

</div>

<!-- NAVIGATION -->
<div class="bottom-nav">

    <a href="index.html" class="nav-item">
        <span class="nav-icon">🏠</span>
        <span class="nav-text">Accueil</span>
    </a>

    <a href="video.html" class="nav-item">
        <span class="nav-icon">🎬</span>
        <span class="nav-text">Vidéos</span>
    </a>

    <a href="tiktok.html" class="nav-item active">
        <span class="nav-icon">❤️</span>
        <span class="nav-text">Pour toi</span>
    </a>

</div>

<script>

const videos = [
{src:"2026-05-16-145429213.mp4", desc:"Moment magique ✨"},
{src:"2026-05-16-145429213.mp4", desc:"Encore nous 🥹"},
{src:"2026-05-16-145429213.mp4", desc:"Souvenirs 🌙"}
];

const feed = document.getElementById("feed");

let currentVideoIndex = 0;
let comments = {};

videos.forEach((v,i)=>{

comments[i] = [];

feed.innerHTML += `
<div class="video-container" data-index="${i}">

<video src="${v.src}" loop playsinline muted></video>

<div class="overlay"></div>

<div class="sound-btn">🔇</div>

<div class="left-info">
<div class="username">@toi ❤️</div>
<div class="description">${v.desc}</div>
</div>

<div class="right-icons">

<div class="icon-box">
<div class="icon like-btn">❤️</div>
<div class="icon-text like-count">0</div>
</div>

<div class="icon-box">
<div class="icon comment-btn">💬</div>
<div class="icon-text comment-count">0</div>
</div>

<div class="icon-box">
<div class="icon favorite-btn">⭐</div>
<div class="icon-text">Fav</div>
</div>

</div>

</div>`;
});

/* SCROLL */
const containers = document.querySelectorAll(".video-container");

const observer = new IntersectionObserver((entries)=>{

entries.forEach(entry=>{

const video = entry.target.querySelector("video");
const index = entry.target.dataset.index;

if(entry.isIntersecting){

currentVideoIndex = index;

document.querySelectorAll("video").forEach(v=>{

if(v!==video){
v.pause();
v.muted = true;
}

});

video.play().catch(()=>{});

}

});

},{threshold:0.8});

containers.forEach(c=>observer.observe(c));

/* SOUND */
document.addEventListener("click",(e)=>{

if(e.target.classList.contains("sound-btn")){

const video = e.target.closest(".video-container").querySelector("video");

video.muted = !video.muted;

e.target.textContent = video.muted ? "🔇" : "🔊";

video.play();

}

});

/* LIKE */
document.addEventListener("click",(e)=>{

if(e.target.classList.contains("like-btn")){

const box = e.target.closest(".icon-box");
const countEl = box.querySelector(".like-count");

let n = parseInt(countEl.textContent);

e.target.classList.toggle("like-active");

n = e.target.classList.contains("like-active")
? n + 1
: n - 1;

countEl.textContent = n;

}

});

/* FAVORITE */
document.addEventListener("click",(e)=>{

if(e.target.classList.contains("favorite-btn")){

e.target.classList.toggle("favorite-active");

}

});

/* COMMENTS */
document.addEventListener("click",(e)=>{

if(e.target.classList.contains("comment-btn")){

const video = e.target.closest(".video-container");

currentVideoIndex = video.dataset.index;

openComments(currentVideoIndex);

}

});

function openComments(i){

const panel = document.getElementById("commentPanel");
const list = document.getElementById("commentList");

list.innerHTML = "";

comments[i].forEach(c=>{

const div = document.createElement("div");

div.className = "comment";
div.textContent = c;

list.appendChild(div);

});

panel.classList.add("active");

}

function sendComment(){

const input = document.getElementById("commentInput");

const text = input.value.trim();

if(!text) return;

comments[currentVideoIndex].push(text);

const list = document.getElementById("commentList");

const div = document.createElement("div");

div.className = "comment";
div.textContent = text;

list.appendChild(div);

const videoEl = document.querySelector(
`.video-container[data-index="${currentVideoIndex}"]`
);

const countEl = videoEl.querySelector(".comment-count");

countEl.textContent =
parseInt(countEl.textContent) + 1;

input.value = "";

}

/* CLOSE COMMENTS */
function closeComments(){

document
.getElementById("commentPanel")
.classList.remove("active");

}

/* DOUBLE TAP LIKE */
document.querySelectorAll(".video-container").forEach(container=>{

let lastTap = 0;

container.addEventListener("click",(e)=>{

if(
e.target.closest(".icon")
|| e.target.classList.contains("sound-btn")
) return;

const now = Date.now();

if(now - lastTap < 300){

const likeBtn = container.querySelector(".like-btn");
const countEl = container.querySelector(".like-count");

let n = parseInt(countEl.textContent);

if(!likeBtn.classList.contains("like-active")){

likeBtn.classList.add("like-active");

countEl.textContent = n + 1;

}

const heart = document.createElement("div");

heart.className = "heart-pop";
heart.innerHTML = "❤️";

container.appendChild(heart);

setTimeout(()=>heart.remove(),600);

}

lastTap = now;

});

});

</script>

</body>
</html>
