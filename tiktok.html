<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-snap-type:y mandatory;
}

body{
    font-family:'Poppins', sans-serif;
    background:black;
    overflow-y:scroll;
    height:100vh;
    color:white;
}

body::-webkit-scrollbar{
    display:none;
}

/* VIDEOS */
.video-container{
    position:relative;
    width:100%;
    height:100vh;
    scroll-snap-align:start;
    overflow:hidden;
}

video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(to top,rgba(0,0,0,0.8),rgba(0,0,0,0.1),rgba(0,0,0,0.3));
}

/* TOP */
.top-bar{
    position:fixed;
    top:0;
    width:100%;
    text-align:center;
    padding:18px;
    z-index:100;
    backdrop-filter:blur(10px);
}

/* LEFT */
.left-info{
    position:absolute;
    bottom:110px;
    left:15px;
    width:70%;
}

.username{font-size:18px;font-weight:600;}
.description{font-size:14px;}
.music{font-size:13px;margin-top:8px;opacity:0.9;}

/* RIGHT ICONS */
.right-icons{
    position:absolute;
    right:12px;
    bottom:110px;
    display:flex;
    flex-direction:column;
    gap:18px;
}

.icon-box{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
}

.icon{
    width:55px;
    height:55px;
    border-radius:50%;
    background:rgba(255,255,255,0.12);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    cursor:pointer;
    transition:0.2s;
}

.icon:hover{transform:scale(1.1);}

.like-active{
    background:rgba(255,0,90,0.55);
    transform:scale(1.2);
}

.favorite-active{
    background:rgba(255,215,0,0.55);
    transform:scale(1.2);
}

.icon-text{
    font-size:13px;
}

/* HEART ANIMATION */
.heart-float{
    position:fixed;
    font-size:26px;
    animation:floatUp 0.9s ease forwards;
    pointer-events:none;
    z-index:9999;
}

@keyframes floatUp{
    0%{opacity:1;transform:translateY(0) scale(1);}
    100%{opacity:0;transform:translateY(-120px) scale(1.6);}
}

/* COMMENTS */
.comments-panel{
    position:fixed;
    top:0;
    right:-100%;
    width:85%;
    max-width:420px;
    height:100vh;
    background:#fff;
    color:#000;
    transition:0.35s ease;
    z-index:999;
    display:flex;
    flex-direction:column;
}

.comments-panel.active{
    right:0;
}

.comments-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
    border-bottom:1px solid #eee;
}

.comments-title{
    font-size:18px;
    font-weight:700;
}

.close-comments{
    font-size:26px;
    cursor:pointer;
}

#commentsList{
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.comment{
    background:#f2f2f2;
    padding:10px 12px;
    border-radius:12px;
    margin-bottom:10px;
    animation:commentPop 0.25s ease;
}

.comment-user{
    font-weight:600;
    font-size:13px;
    margin-bottom:4px;
}

.comment-input-area{
    display:flex;
    gap:10px;
    padding:12px;
    border-top:1px solid #eee;
}

.comment-input-area input{
    flex:1;
    padding:10px;
    border-radius:20px;
    border:1px solid #ccc;
    outline:none;
}

.comment-input-area button{
    background:#ff2d55;
    color:white;
    border:none;
    padding:10px 14px;
    border-radius:20px;
    cursor:pointer;
}

@keyframes commentPop{
    0%{transform:scale(0.8);opacity:0;}
    50%{transform:scale(1.05);opacity:1;}
    100%{transform:scale(1);}
}

/* BOTTOM NAV */
.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:70px;
    background:rgba(0,0,0,0.75);
    backdrop-filter:blur(15px);
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:100;
    border-top:1px solid rgba(255,255,255,0.1);
}

.nav-item{
    color:white;
    text-decoration:none;
    font-size:12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    opacity:0.85;
}

.nav-icon{font-size:20px;}
</style>
</head>

<body>

<div class="top-bar">Pour Toi ❤️</div>

<!-- VIDEOS -->
<div class="video-container">
    <video src="videos/video1.mp4" loop muted playsinline></video>
    <div class="overlay"></div>

    <div class="left-info">
        <div class="username">@toi ❤️</div>
        <div class="description">Moment magique ✨</div>
        <div class="music">🎵 Love</div>
    </div>

    <div class="right-icons">
        <div class="icon-box">
            <div class="icon like-btn">❤️</div>
            <div class="icon-text like-text">999</div>
        </div>
        <div class="icon-box">
            <div class="icon comment-btn">💬</div>
            <div class="icon-text comment-text">3</div>
        </div>
        <div class="icon-box">
            <div class="icon favorite-btn">⭐</div>
            <div class="icon-text">Fav</div>
        </div>
    </div>
</div>

<div class="video-container">
    <video src="videos/video2.mp4" loop muted playsinline></video>
    <div class="overlay"></div>

    <div class="left-info">
        <div class="username">@toi ❤️</div>
        <div class="description">Encore nous 🥹</div>
        <div class="music">🎵 Song</div>
    </div>

    <div class="right-icons">
        <div class="icon-box">
            <div class="icon like-btn">❤️</div>
            <div class="icon-text like-text">1,2k</div>
        </div>
        <div class="icon-box">
            <div class="icon comment-btn">💬</div>
            <div class="icon-text comment-text">4</div>
        </div>
        <div class="icon-box">
            <div class="icon favorite-btn">⭐</div>
            <div class="icon-text">Fav</div>
        </div>
    </div>
</div>

<div class="video-container">
    <video src="videos/video3.mp4" loop muted playsinline></video>
    <div class="overlay"></div>

    <div class="left-info">
        <div class="username">@toi ❤️</div>
        <div class="description">Souvenirs 🌙</div>
        <div class="music">🎵 Slow</div>
    </div>

    <div class="right-icons">
        <div class="icon-box">
            <div class="icon like-btn">❤️</div>
            <div class="icon-text like-text">2,4k</div>
        </div>
        <div class="icon-box">
            <div class="icon comment-btn">💬</div>
            <div class="icon-text comment-text">5</div>
        </div>
        <div class="icon-box">
            <div class="icon favorite-btn">⭐</div>
            <div class="icon-text">Fav</div>
        </div>
    </div>
</div>

<!-- COMMENTS -->
<div class="comments-panel" id="commentsPanel">

    <div class="comments-header">
        <div class="comments-title">Commentaires</div>
        <div class="close-comments" id="closeComments">✕</div>
    </div>

    <div id="commentsList">
        <div class="comment">
            <div class="comment-user">France ❤️</div>
            <div>J’aime trop 🥹</div>
        </div>
    </div>

    <div class="comment-input-area">
        <input id="commentInput" placeholder="Écris un commentaire..." />
        <button id="sendComment">Envoyer</button>
    </div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
    <a href="index.html" class="nav-item">
        <div class="nav-icon">🏠</div>
        <span>Accueil</span>
    </a>
    <a href="video.html" class="nav-item">
        <div class="nav-icon">🎬</div>
        <span>Vidéos</span>
    </a>
    <a href="tiktok.html" class="nav-item">
        <div class="nav-icon">❤️</div>
        <span>Pour Toi</span>
    </a>
</div>

<!-- SOUND -->
<audio id="popSound" src="https://assets.mixkit.co/sfx/preview/mixkit-interface-click-1126.mp3"></audio>

<script>

const containers = document.querySelectorAll('.video-container');
const popSound = document.getElementById('popSound');

/* UNLOCK AUDIO */
document.addEventListener('click', () => {
    popSound.play().then(() => {
        popSound.pause();
        popSound.currentTime = 0;
    }).catch(()=>{});
}, { once: true });

function updateLike(container, delta){
    const counter = container.querySelector('.like-text');
    let val = parseFloat(counter.innerText.replace('k','').replace(',','.')) || 0;

    val += delta;
    if(val < 0) val = 0;

    counter.innerText = val >= 1000
        ? (val/1000).toFixed(1).replace('.',',') + 'k'
        : Math.floor(val);
}

function updateComment(container, delta){
    const counter = container.querySelector('.comment-text');
    let val = parseInt(counter.innerText) || 0;
    val += delta;
    counter.innerText = val;
}

/* VIDEOS + DOUBLE TAP */
containers.forEach(container => {

    const video = container.querySelector('video');
    const likeBtn = container.querySelector('.like-btn');
    const favBtn = container.querySelector('.favorite-btn');

    let clickTimer = null;

    video.addEventListener('click', () => {

        if(clickTimer === null){
            clickTimer = setTimeout(() => {
                clickTimer = null;
                video.paused ? video.play() : video.pause();
            }, 250);
        } else {
            clearTimeout(clickTimer);
            clickTimer = null;

            likeBtn.classList.add('like-active');
            updateLike(container, 1);

            // ❤️ animation
            const rect = likeBtn.getBoundingClientRect();
            const heart = document.createElement('div');
            heart.classList.add('heart-float');
            heart.innerText = '❤️';
            heart.style.left = rect.left + 'px';
            heart.style.top = rect.top + 'px';

            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 900);
        }
    });

    likeBtn.addEventListener('click', () => {
        const active = likeBtn.classList.contains('like-active');
        likeBtn.classList.toggle('like-active');
        updateLike(container, active ? -1 : 1);
    });

    favBtn.addEventListener('click', () => {
        favBtn.classList.toggle('favorite-active');
    });
});

/* COMMENTS */
const panel = document.getElementById('commentsPanel');
const list = document.getElementById('commentsList');
const input = document.getElementById('commentInput');

let activeContainer = null;

document.querySelectorAll('.comment-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        activeContainer = btn.closest('.video-container');
        panel.classList.add('active');
    });
});

document.getElementById('closeComments').onclick = () => {
    panel.classList.remove('active');
};

document.getElementById('sendComment').onclick = () => {

    const text = input.value.trim();
    if(!text || !activeContainer) return;

    const div = document.createElement('div');
    div.className = 'comment';
    div.innerHTML = `
        <div class="comment-user">@toi</div>
        <div>${text}</div>
    `;

    list.prepend(div);
    input.value = "";

    updateComment(activeContainer, 1);

    // 🔊 SOUND
    popSound.currentTime = 0;
    popSound.play().catch(()=>{});
};

input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
        document.getElementById('sendComment').click();
    }
});

</script>

</body>
</html>
