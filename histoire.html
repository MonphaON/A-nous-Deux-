<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Histoires 🌙</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;

    /* 🌙 NOUVEAU FOND (nuit + étoiles) */
    background:
        radial-gradient(circle at top, #1b1b3a 0%, #0b0b1a 50%, #050510 100%);

    color:white;
    min-height:100vh;
}

/* ✨ petites étoiles */
body::before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background-image: radial-gradient(white 1px, transparent 1px);
    background-size: 50px 50px;
    opacity:0.15;
    pointer-events:none;
}

/* 🌸 NAVBAR (identique à ton site) */

header{
    width:100%;
    padding:25px 60px;
    position:fixed;
    top:0;
    left:0;
    z-index:100;
    backdrop-filter: blur(15px);
    background: rgba(0,0,0,0.25);
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:2rem;
    font-weight:700;
    background: linear-gradient(90deg,#ff80ab,#fff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

nav ul{
    display:flex;
    gap:35px;
    list-style:none;
}

nav a{
    text-decoration:none;
    color:white;
    transition:0.3s;
}

nav a:hover{
    color:#ff80ab;
}

/* 🌙 CONTENU */

.container{
    padding-top:140px;
    display:flex;
    justify-content:center;
}

.box{
    width:900px;
    max-width:92%;
}

/* titre */
h1{
    font-size:3.5rem;
    margin-bottom:15px;
}

p{
    opacity:0.8;
    margin-bottom:40px;
}

/* 💖 cartes histoires */

.stories{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.story-card{
    padding:25px;
    border-radius:18px;
    background: rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    transition:0.3s;
    cursor:pointer;
}

.story-card:hover{
    transform: translateY(-6px);
    background: rgba(255,255,255,0.12);
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

.story-card a{
    text-decoration:none;
    color:white;
}

.story-card h3{
    margin-bottom:8px;
}
</style>

</head>

<body>

<header>
    <nav>
        <h1 class="logo">A Nous Deux</h1>

        <ul>
            <li><a href="index.html">Accueil</a></li>
            <li><a href="histoires.html">Histoires</a></li>
            <li><a href="#">Vidéos</a></li>
            <li><a href="#">Travaux ⚠️</a></li>
        </ul>
    </nav>
</header>

<div class="container">
<div class="box">

<h1>Histoires 🌙</h1>
<p>Choisis une histoire pour t’endormir ou te réconforter. Je suis là avec toi ❤️</p>

<div class="stories">

    <div class="story-card">
        <a href="histoire1.html">
            <h3>🌙 Histoire 1</h3>
            <p>Pour t’apaiser avant de dormir</p>
        </a>
    </div>

    <div class="story-card">
        <a href="histoire2.html">
            <h3>💤 Histoire 2</h3>
            <p>Quand tu as besoin de calme</p>
        </a>
    </div>

    <div class="story-card">
        <a href="histoire3.html">
            <h3>❤️ Histoire 3</h3>
            <p>Quand tu veux te sentir aimée</p>
        </a>
    </div>

</div>

</div>
</div>

</body>
</html>
